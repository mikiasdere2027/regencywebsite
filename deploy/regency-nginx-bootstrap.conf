# regencyparkingservice.com — STAGE 1 (HTTP only, before the certificate).
# Installed as /etc/nginx/sites-available/regency by `setup-regency.sh stage1`.
# Serves the ACME challenge for certbot and the site over plain HTTP, so the
# DNS switch shows the new site immediately; stage 2 adds HTTPS.

server {
  listen 80;
  listen [::]:80;
  server_name regencyparkingservice.com www.regencyparkingservice.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  include /etc/nginx/snippets/regency-proxy.conf;
}
