# regencyparkingservice.com — STAGE 2 (HTTPS). Installed as
# /etc/nginx/sites-available/regency by `setup-regency.sh stage2`, once
# certbot has issued /etc/letsencrypt/live/regencyparkingservice.com/.

server {
  listen 80;
  listen [::]:80;
  server_name regencyparkingservice.com www.regencyparkingservice.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }
  location / {
    return 301 https://regencyparkingservice.com$request_uri;
  }
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.regencyparkingservice.com;
  ssl_certificate     /etc/letsencrypt/live/regencyparkingservice.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/regencyparkingservice.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://regencyparkingservice.com$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name regencyparkingservice.com;
  ssl_certificate     /etc/letsencrypt/live/regencyparkingservice.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/regencyparkingservice.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  add_header Strict-Transport-Security "max-age=300" always;
  include /etc/nginx/snippets/regency-proxy.conf;
}
